<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Proyecto</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f4f4f4;
        color: #333;
      }

      header {
        background: #222;
        color: white;
        padding: 20px;
        text-align: center;
      }

      main {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #222;
      }

      p {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Bienvenido</h1>
    </header>

    <main>
      <h2>Mi primera página</h2>
      <p>Este es un código base en HTML para comenzar un proyecto web.</p>
      <button type="button">Haz clic</button>
    </main>
  </body>
</html>
